# ═══════════════════════════════════════════════════════════════════
# Kiwi Store API Worker — Cloudflare Workers + Cloudflare D1 (`store`)
#
# Routes (Custom Domain ya Zone Route):
#   kiwistore.gothwadtech.com/api/*
#   kiwiconsole.gothwadtech.com/api/*
#   kiwiadmin.gothwadtech.com/api/*
#   kiwiapp.gothwadtech.com/api/*
#
# Secrets (Dashboard ya `wrangler secret put` se set karein):
#   wrangler secret put GITHUB_FILES_TOKEN
# ═══════════════════════════════════════════════════════════════════

name = "store"
main = "src/index.ts"
compatibility_date = "2025-09-01"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "store"
database_id = "a3dc3e71-cf89-4e0a-89d1-693fcf6f227a"

[vars]
APP_NAME = "Kiwi Store"
APP_SHORT_NAME = "Kiwi"
ECOSYSTEM_NAME = "Gothwad"
APP_DOMAIN = "gothwadtech.com"
STOREAPP_PACKAGE = "com.gothwad.store"

STORE_HOST = "kiwistore"
CONSOLE_HOST = "kiwiconsole"
ADMIN_HOST = "kiwiadmin"
STOREAPP_HOST = "kiwiapp"
STORE_PUBLIC_URL = "https://kiwistore.gothwadtech.com"

AUTH_HUB_URL = "https://api.gothwadtech.com"
ACCOUNTS_API_URL = "https://api.gothwadtech.com"
AUTH_SIGNIN_URL = "https://accounts.gothwadtech.com"
ACCOUNTS_WEB_URL = "https://accounts.gothwadtech.com"
OAUTH_CLIENT_ID = "kiwi-store"
ADMIN_USERNAMES = "pawan"

GITHUB_FILES_OWNER = "GothwadTech"
GITHUB_FILES_REPO = "storefiles"
GITHUB_REPO = "GothwadTech/storefiles"
GITHUB_BRANCH = "main"

ALLOWED_ORIGINS = ""
